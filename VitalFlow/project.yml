name: VitalFlow
options:
  bundleIdPrefix: com.example.vitalflow
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  VitalFlowCore:
    path: Packages/VitalFlowCore

targets:
  VitalFlow:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - package: VitalFlowCore
      - target: VitalFlowWidgets
        embed: true
      - target: VitalFlowWatch
      - sdk: HealthKit.framework
      - sdk: WidgetKit.framework
    entitlements:
      path: iOS/VitalFlow.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.$(VF_BUNDLE_PREFIX)
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: VitalFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSHealthShareUsageDescription: "VitalFlow reads your heart rate, HRV, sleep, activity and other Health data to calculate on-device wellness estimates. Your data never leaves your device unless you explicitly enable an external assistant."
        NSHealthUpdateUsageDescription: "VitalFlow saves the water intake you log to the Health app."
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [$(VF_BUNDLE_PREFIX).refresh]
        VFAppGroup: group.$(VF_BUNDLE_PREFIX)
        CFBundleAllowMixedLocalizations: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VF_BUNDLE_PREFIX)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  VitalFlowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared/Common
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/VitalFlowWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(VF_BUNDLE_PREFIX)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: VitalFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VFAppGroup: group.$(VF_BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VF_BUNDLE_PREFIX).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  VitalFlowWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    dependencies:
      - package: VitalFlowCore
      - target: VitalFlowWatchWidgets
        embed: true
      - sdk: HealthKit.framework
    entitlements:
      path: Watch/VitalFlowWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.$(VF_BUNDLE_PREFIX)
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: VitalFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(VF_BUNDLE_PREFIX)
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: "VitalFlow reads heart rate, activity and sleep data to show your wellness summary on Apple Watch."
        NSHealthUpdateUsageDescription: "VitalFlow saves workouts you start on Apple Watch and the water intake you log to the Health app."
        VFAppGroup: group.$(VF_BUNDLE_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VF_BUNDLE_PREFIX).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  VitalFlowWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: Shared/Common
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: WatchWidgets/VitalFlowWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(VF_BUNDLE_PREFIX)
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: VitalFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VFAppGroup: group.$(VF_BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VF_BUNDLE_PREFIX).watchkitapp.complications
        SKIP_INSTALL: YES

  VitalFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VitalFlow
      - package: VitalFlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VF_BUNDLE_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VitalFlow:
    build:
      targets:
        VitalFlow: all
        VitalFlowTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VitalFlowTests
    run:
      config: Debug
    archive:
      config: Release
  VitalFlowWatch:
    build:
      targets:
        VitalFlowWatch: all
    run:
      config: Debug
    archive:
      config: Release
