name: VitalFlow CI

on:
  push:
    paths: ["VitalFlow/**", ".github/workflows/vitalflow-*.yml"]
  pull_request:
    paths: ["VitalFlow/**", ".github/workflows/vitalflow-*.yml"]
  workflow_dispatch:

concurrency:
  group: vitalflow-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: VitalFlow

jobs:
  core-linux:
    name: Core algorithms (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Unit tests (VitalFlowCore)
        run: swift test --package-path Packages/VitalFlowCore
      - name: Localization coverage (en / zh-Hans / zh-Hant)
        run: python3 scripts/build_strings.py --check

  apple:
    name: iOS + watchOS build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Tool versions
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Core unit tests (macOS)
        run: swift test --package-path Packages/VitalFlowCore
      - name: Pick iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=[(k,v) for k,v in d.items() if "iOS" in k]
          ios.sort(key=lambda kv: [int(x) for x in kv[0].split("iOS-")[-1].split("-")])
          for k,v in reversed(ios):
              for dev in v:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"
      - name: Build & test iOS app (includes embedded watch app and widgets)
        run: |
          set -o pipefail
          xcodebuild test \
            -project VitalFlow.xcodeproj -scheme VitalFlow \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/VitalFlowTests.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee build-ios.log | xcpretty || (tail -200 build-ios.log; exit 1)
      - name: Build watchOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project VitalFlow.xcodeproj -scheme VitalFlowWatch \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGNING_ALLOWED=NO | tee build-watch.log | xcpretty || (tail -200 build-watch.log; exit 1)
      - name: Upload generated Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VitalFlow-xcodeproj
          path: VitalFlow/VitalFlow.xcodeproj
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VitalFlow-test-results
          path: |
            VitalFlow/build/VitalFlowTests.xcresult
            VitalFlow/build-*.log
